<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Pogoda, ruch</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    iframe.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- POGODA -->
  <iframe class="active"
    src="https://pogoda.onet.pl/prognoza-pogody/warszawa-357732">
  </iframe>

  <!-- NATĘŻENIE RUCHU  -->
 <iframe 
	src="https://embed.waze.com/iframe?zoom=13&lat=52.239627&lon=21.031952&ct=livemap" width="600" height="450" allowfullscreen>
  </iframe>

  <script>
    // Odświeżenie całej strony co 3 minuty
    setTimeout(function() {
      location.reload();
    }, 180000); // 180 000 ms = 3 minuty

    // Zmiana aktywnego iframe co 1 minutę
    const iframes = document.querySelectorAll("iframe");
    let current = 0;
    setInterval(() => {
      iframes[current].classList.remove("active");
      current = (current + 1) % iframes.length;
      iframes[current].classList.add("active");
    }, 60000); // 60 000 ms = 1 minuta
  </script>

</body>

</html>
